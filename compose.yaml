services:
  postgres:
    image: postgres:16
    container_name: medimemory-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: caretalk_dev
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - medimemory_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d caretalk_dev"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  medimemory_pg_data:
